<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTelemetry Frontend Tracing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 50px;
            display: none;
            background-color: #f9f9f9;
            text-align: left;
        }
        .trace-info {
            margin-bottom: 10px;
        }
        .api-response {
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 4px;
        }
        .api-error {
            margin-top: 15px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
            color: #c62828;
        }
        .page-timer {
            font-size: 12px;
            color: #757575;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenTelemetry Frontend Tracing</h1>
        <p>Click the button below to generate a trace</p>
        <button id="traceButton">Click Me</button>
        <div id="result"></div>
        <div id="pageTimer" class="page-timer"></div>
    </div>

    <!-- Load OpenTelemetry dynamically -->
    <script type="module">
        import { WebTracerProvider } from 'https://cdn.jsdelivr.net/npm/@opentelemetry/sdk-trace-web/+esm';
        import { BatchSpanProcessor, SimpleSpanProcessor } from 'https://cdn.jsdelivr.net/npm/@opentelemetry/sdk-trace-base/+esm';
        import { ConsoleSpanExporter } from 'https://cdn.jsdelivr.net/npm/@opentelemetry/sdk-trace-base/+esm';
        import { OTLPTraceExporter } from 'https://cdn.jsdelivr.net/npm/@opentelemetry/exporter-trace-otlp-http/+esm';
        import { trace } from 'https://cdn.jsdelivr.net/npm/@opentelemetry/api/+esm';
        import { Resource } from 'https://cdn.jsdelivr.net/npm/@opentelemetry/resources/+esm';
        import { SEMRESATTRS_SERVICE_NAME } from 'https://cdn.jsdelivr.net/npm/@opentelemetry/semantic-conventions/+esm';

        console.log("✅ OpenTelemetry modules loaded successfully!");

        // ✅ Initialize OpenTelemetry Web Tracer Provider
        const provider = new WebTracerProvider({
            resource: new Resource({
                [SEMRESATTRS_SERVICE_NAME]: 'frontend-app',
            }),
        });

        // ✅ Configure OTLP Exporter (Send traces to Tempo)
        const otlpExporter = new OTLPTraceExporter({
            url: `${window.location.origin}/api/v1/traces`, // Uses Nginx to proxy the request
        });
        provider.addSpanProcessor(new BatchSpanProcessor(otlpExporter)); // Send traces to Tempo
        provider.addSpanProcessor(new SimpleSpanProcessor(new ConsoleSpanExporter())); // Debugging

        provider.register();

        console.log('🚀 OpenTelemetry Initialized');

        // ✅ Helper function to create spans
        function createSpan(name) {
            const tracer = trace.getTracer('frontend-app');
            return tracer.startSpan(name);
        }

        // ✅ Function to handle button click with OpenTelemetry
        function handleButtonClick() {
            console.log('User clicked the button');

            // Show result box
            const resultElement = document.getElementById('result');
            resultElement.style.display = 'block';

            // ✅ Start a new span for this action
            const span = createSpan('User Clicked Button');

            // ✅ Generate trace headers dynamically
            const traceId = span.spanContext().traceId;
            const spanId = span.spanContext().spanId;
            const traceparent = `00-${traceId}-${spanId}-01`;

            console.log(`🛠️ Generated Trace ID: ${traceId}`);
            console.log(`🛠️ Generated Span ID: ${spanId}`);
            console.log(`🛠️ Generated Traceparent: ${traceparent}`);

            resultElement.innerHTML = `
                <div class="trace-info">
                    <p>Trace generated at: ${new Date().toLocaleTimeString()}</p>
                    <p>Trace ID: ${traceId}</p>
                    <p>Span ID: ${spanId}</p>
                </div>
            `;

            // ✅ Send API request with traceparent header
            fetch('/api/hello', {
                headers: { 'traceparent': traceparent }
            })
            .then(response => response.text())
            .then(data => {
                console.log('✅ API response:', data);
                resultElement.innerHTML += `<div class="api-response"><p>API Response: ${data}</p></div>`;
            })
            .catch(error => {
                console.error('❌ API error:', error);
                resultElement.innerHTML += `<div class="api-error"><p>API Error: ${error.message}</p></div>`;
            })
            .finally(() => {
                span.end();
                provider.forceFlush().then(() => console.log("✅ Traces flushed to Tempo!"))
                .catch(err => console.error("❌ Trace export failed:", err));
            });
        }

        // ✅ Attach event listener
        document.getElementById('traceButton').addEventListener('click', handleButtonClick);

        console.log('Frontend app initialized');
    </script>
</body>
</html>
