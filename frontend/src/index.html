<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Tracing Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        
        .container {
            width: 80%;
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 1rem 0;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        #result {
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 50px;
            display: none;
            background-color: #f9f9f9;
            text-align: left;
        }
        
        .trace-info {
            margin-bottom: 10px;
        }
        
        .api-response {
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 4px;
        }
        
        .api-error {
            margin-top: 15px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
            color: #c62828;
        }
        
        .page-timer {
            font-size: 12px;
            color: #757575;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenTelemetry Frontend Tracing Demo</h1>
        <p>Click the button below to generate a trace</p>
        <button id="traceButton" onclick="handleButtonClick()">Click Me</button>
        <div id="result"></div>
        <div id="pageTimer" class="page-timer"></div>
    </div>

    <script>
        // Helper function to generate random IDs for trace and span
        function generateRandomId(length) {
            const characters = '0123456789abcdef';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * 16));
            }
            return result;
        }
        
        // Function to handle button click
        function handleButtonClick() {
            console.log('User clicked the button');
            
            // Show result
            const resultElement = document.getElementById('result');
            resultElement.style.display = 'block';
            
            // Generate a random trace ID and span ID for demonstration
            const traceId = generateRandomId(32);
            const spanId = generateRandomId(16);
            
            resultElement.innerHTML = `
                <div class="trace-info">
                    <p>Trace generated at: ${new Date().toLocaleTimeString()}</p>
                    <p>Trace ID: ${traceId}</p>
                    <p>Span ID: ${spanId}</p>
                </div>
            `;
            
            // Make a sample API call to demonstrate distributed tracing
            // Add a mock response for demo purposes since the API might not be available
            console.log('Simulating API call with trace ID:', traceId);
            
            // First try the real API
            fetch('/api/hello', {
                headers: {
                    'traceparent': `00-${traceId}-${spanId}-01`
                }
            })
            .then(response => {
                console.log('API response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                console.log('API response:', data);
                resultElement.innerHTML += `<div class="api-response"><p>API Response: ${data}</p></div>`;
            })
            .catch(error => {
                console.error('API error:', error);
                // Show error but also add mock response for demo purposes
                resultElement.innerHTML += `<div class="api-error"><p>API Error: ${error.message}</p></div>`;
                resultElement.innerHTML += `<div class="api-response"><p>Mock API Response (Demo): Hello from service-b! Your trace has been captured.</p>
                <p><em>Note: This is a simulated response for demonstration purposes. The actual backend service may not be available.</em></p></div>`;
            });
        }
        
        // Page load timer
        let startTime = new Date();
        setInterval(() => {
            const seconds = Math.floor((new Date() - startTime) / 1000);
            document.getElementById('pageTimer').textContent = `You've been on this page for ${seconds.toFixed(2)} seconds`;
        }, 1000);
        
        console.log('Frontend app initialized');
    </script>
</body>
</html>
